name: Build and Push

on:
  push:
    branches: [main]
    # Only rebuild when the app changes. Manifest or docs commits must not
    # create new Freight (and Kargo's pushes to stage/* never trigger CI).
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/kargo-demo-app:latest
            ghcr.io/${{ github.repository_owner }}/kargo-demo-app:${{ github.sha }}
          # The sha tag produces the immutable digest reference Kargo will use

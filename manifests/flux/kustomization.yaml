apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Overlay for the stage that is deployed by Flux instead of Argo CD.
# Kargo runs `kustomize-set-image` on this folder (in its own working copy),
# renders it with `kustomize-build` and pushes the result to the
# `stage/qa-flux` branch. Flux only ever reads that branch.
namespace: demo-flux
resources:
  - ../base
namePrefix: flux-
